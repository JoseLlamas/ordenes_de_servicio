services:
  app:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:10002:3000"
    hostname: "ordenes_de_servicio.local"
    container_name: ordenes_de_servicio
    image: ordenes_de_servicio
    restart: unless-stopped
    user: "node:node"
    volumes:
      - ./data/firmas:/app/uploads/firmas
      - ./data/avatares:/app/uploads/avatares
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORIGIN: ${ORIGIN}
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
      TZ: ${TIME_ZONE:-UTC}
      NODE_ENV: production
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: ${MYSQL_PORT}

  db:
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    image: "mysql:9.5"
    ports:
      - "127.0.0.1:3311:3306"
    hostname: "ordenes_de_servicio-mysql.local"
    container_name: "ordenes_de_servicio-mysql.local"
    environment:
      TZ: ${TIME_ZONE:-UTC}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: 3306
    volumes:
      - mysqldata:/var/lib/mysql

  migrate:
    image: ordenes_de_servicio-tools
    build:
      context: .
      target: tools
    command: pnpm db:migrate
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  seed:
    image: ordenes_de_servicio-tools
    build:
      context: .
      target: tools
    command: node ./src/lib/server/db/seed.js
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  mysqldata:
